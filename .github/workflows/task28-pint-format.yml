name: Task 28 one-time Pint formatter

on:
  push:
    branches:
      - task/28-security-privacy-audit
    paths:
      - .github/workflows/task28-pint-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/28-security-privacy-audit

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply repository Pint formatting to changed PHP files
        run: vendor/bin/pint app/Services/AuditLogBackupService.php app/Console/Commands/VerifyLatestAuditLogBackup.php tests/Feature/AuditLogBackupTest.php

      - name: Commit only formatter changes
        run: |
          if git diff --quiet -- app/Services/AuditLogBackupService.php app/Console/Commands/VerifyLatestAuditLogBackup.php tests/Feature/AuditLogBackupTest.php; then
            echo "The files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/AuditLogBackupService.php app/Console/Commands/VerifyLatestAuditLogBackup.php tests/Feature/AuditLogBackupTest.php
          git commit -m "style: format Task 28 backup restore implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
