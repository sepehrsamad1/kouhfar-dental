name: Task 28 one-time Pint formatter

on:
  push:
    branches:
      - task/28-security-privacy-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/28-security-privacy-audit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint formatting and commit only formatted source/tests
        run: |
          vendor/bin/pint
          if git diff --quiet -- app tests; then
            echo "No formatting changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app tests
            git commit -m "Task 28: apply Pint formatting"
            git push origin HEAD:task/28-security-privacy-audit
          fi
