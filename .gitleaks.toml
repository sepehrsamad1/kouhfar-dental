[extend]
useDefault = true

[[allowlists]]
description = "Historical synthetic MeliPayamak provider-contract test token only; no live credential. Match both the exact fixture value and its dedicated test file."
condition = "AND"
regexTarget = "line"
regexes = [
  '''[0-9]{10}[a-f]{6}[0-9]{10}[a-f]{6}''',
]
paths = [
  '''MeliPayamakOtpProviderTest\.php$''',
]
