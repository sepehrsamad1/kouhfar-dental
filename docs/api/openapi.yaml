openapi: 3.1.0
info:
  title: Kouhfar Dental Clinic API
  version: 0.3.0
  description: Package 3 contract. Drafted, not implemented. Frontend and backend build against this file.
servers:
  - url: /
x-task-12-staff-web-routes:
  description: >
    Task 12 configuration management is implemented as authenticated Laravel web routes,
    not as a new public or versioned JSON API. Service configuration includes a nullable required resource type (`dental_unit` or `consultation_room`); practitioner-service assignments are managed explicitly and do not imply verified qualifications. All routes require auth:staff and
    staff.session.fresh. Mutations use existing Laravel Policies/Gates and remain
    administrator-only under the approved Task 10 role matrix.
  routes:
    - { method: GET, path: /staff/configuration, access: staff-read }
    - { method: POST, path: /staff/configuration/services, access: admin }
    - { method: PATCH, path: /staff/configuration/services/{service}, access: admin }
    - { method: POST, path: /staff/configuration/practitioners, access: admin }
    - { method: PATCH, path: /staff/configuration/practitioners/{practitioner}, access: admin }
    - { method: PATCH, path: /staff/configuration/practitioners/{practitioner}/services, access: admin }
    - { method: POST, path: /staff/configuration/resources, access: admin }
    - { method: PATCH, path: /staff/configuration/resources/{resource}, access: admin }
    - { method: POST, path: /staff/configuration/clinic-hours, access: admin }
    - { method: PATCH, path: /staff/configuration/clinic-hours/{hour}, access: admin }
    - { method: DELETE, path: /staff/configuration/clinic-hours/{hour}, access: admin }
    - { method: POST, path: /staff/configuration/working-hours, access: admin }
    - { method: PATCH, path: /staff/configuration/working-hours/{hour}, access: admin }
    - { method: DELETE, path: /staff/configuration/working-hours/{hour}, access: admin }
    - { method: POST, path: /staff/configuration/breaks, access: admin }
    - { method: PATCH, path: /staff/configuration/breaks/{break}, access: admin }
    - { method: DELETE, path: /staff/configuration/breaks/{break}, access: admin }
    - { method: POST, path: /staff/configuration/exceptions, access: admin }
    - { method: PATCH, path: /staff/configuration/exceptions/{exception}, access: admin }
    - { method: DELETE, path: /staff/configuration/exceptions/{exception}, access: admin }
x-task-28-deletion-request-workflow:
  description: >-
    Authenticated staff web actions for review and administrative closure of a
    deletion request. These actions record an assessment outcome only. They do
    not delete patient, CRM, appointment, consent, media, backup or audit data.
    Active administrators only; Laravel session authentication and CSRF apply.
  states: [pending, under_review, rejected, closed]
  reviewDecisions: [accept_for_assessment, reject]
  rejectionReasonCodes: [identity_not_verified, outside_scope, duplicate_request]
  resolutionCodes: [retained_by_policy, legal_hold, correction_completed, no_action_required]
  routes:
    - { method: POST, path: /staff/deletion-requests/{deletionRequest}/review, access: active-admin }
    - { method: POST, path: /staff/deletion-requests/{deletionRequest}/close, access: active-admin }
  securityBoundary: >-
    Closing a request is not proof of physical erasure. No automatic deletion,
    anonymization, backup rewrite or third-party propagation is performed.
tags:
  - { name: public }
  - { name: staff }
  - { name: admin }
  - { name: health }
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: sid
    followUpToken:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, SLOT_UNAVAILABLE, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS, RATE_LIMITED, CSRF_INVALID, INTERNAL]
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
    Page:
      type: object
      required: [data]
      properties:
        data: { type: array, items: {} }
        nextCursor: { type: [string, "null"] }
    BookingStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled, no_show, expired]
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 with offset. Server returns UTC (Z).
    Service:
      type: object
      required: [id, name, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
    Slot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { $ref: '#/components/schemas/Timestamp' }
        endAt: { $ref: '#/components/schemas/Timestamp' }
    BookingRequest:
      type: object
      required: [serviceId, startAt, fullName, mobile]
      properties:
        serviceId: { type: string, format: uuid }
        startAt: { $ref: '#/components/schemas/Timestamp' }
        fullName: { type: string, minLength: 3, maxLength: 120 }
        mobile: { type: string, description: 'Persian, Arabic, or Latin digits. Normalized on server.' }
        verificationGrant: { type: string, description: 'Required only if D8 approved.' }
      additionalProperties: false
    BookingCreated:
      type: object
      required: [id, status, expiresAt, followUpToken]
      properties:
        id: { type: string, format: uuid }
        status: { const: pending }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        followUpToken: { type: string, description: 'One booking, limited action scope. Not a staff session.' }
    Appointment:
      type: object
      required: [id, status, startAt, endAt, version]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        serviceId: { type: string, format: uuid }
        practitionerId: { type: string, format: uuid }
        startAt: { $ref: '#/components/schemas/Timestamp' }
        endAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        version: { type: integer }
    TransitionRequest:
      type: object
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum: [confirm, reject, cancel, complete, no_show, reschedule]
        expectedVersion: { type: integer }
        startAt: { $ref: '#/components/schemas/Timestamp' }
        reason: { type: string, maxLength: 500 }
      additionalProperties: false
    Patient:
      type: object
      required: [id, fullName, mobile]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        mobile: { type: string }
        dateOfBirth: { type: [string, "null"], format: date }
        archivedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 256 }
      additionalProperties: false
paths:
  /health/live:
    get:
      tags: [health]
      responses:
        '200': { description: Process is up }
  /health/ready:
    get:
      tags: [health]
      description: Checks DB only. No details publicly.
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /api/public/services:
    get:
      tags: [public]
      responses:
        '200':
          description: Active, public-bookable services
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Service' } }
  /api/public/availability:
    get:
      tags: [public]
      parameters:
        - { name: serviceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date, description: 'Gregorian date in clinic timezone' } }
      responses:
        '200':
          description: Free slots only. No patient data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { description: Rate limited }
  /api/public/booking-requests:
    post:
      tags: [public]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: Pending request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingCreated' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: Rate limited }
  /api/public/booking-requests/{id}:
    get:
      tags: [public]
      security: [{ followUpToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Own booking only, minimal fields
          content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: Not found or not allowed (same response for both) }
    delete:
      tags: [public]
      security: [{ followUpToken: [] }]
      description: Cancel own pending or confirmed booking before D10 cutoff. Re-verification required if D8 approved.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/staff/auth/login:
    post:
      tags: [staff]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Session created, rotated cookie set }
        '401': { description: Generic failure (non-enumerable), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Locked or rate limited }
  /api/staff/auth/logout:
    post:
      tags: [staff]
      security: [{ staffSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Session revoked }
  /api/staff/patients:
    get:
      tags: [staff]
      security: [{ staffSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Paginated, capped search. Near-matches flagged.
          content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [staff]
      security: [{ staffSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, mobile]
              properties:
                fullName: { type: string, minLength: 3, maxLength: 120 }
                mobile: { type: string }
                dateOfBirth: { type: [string, "null"], format: date }
              additionalProperties: false
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } } }
        '409': { description: Possible duplicate; returned as flag, not merged, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/staff/appointments:
    get:
      tags: [staff]
      security: [{ staffSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Timestamp' } }
      responses:
        '200': { description: Paginated list, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
    post:
      tags: [staff]
      security: [{ staffSession: [] }]
      description: Staff direct booking (D7). Creates a confirmed booking.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, serviceId, startAt]
              properties:
                patientId: { type: string, format: uuid }
                serviceId: { type: string, format: uuid }
                practitionerId: { type: string, format: uuid }
                startAt: { $ref: '#/components/schemas/Timestamp' }
              additionalProperties: false
      responses:
        '201': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/staff/appointments/{id}/transitions:
    post:
      tags: [staff]
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransitionRequest' } } }
      responses:
        '200': { description: Transition applied, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: INVALID_STATE_TRANSITION, SLOT_UNAVAILABLE, or version mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      tags: [admin]
      security: [{ staffSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Paginated staff users, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      security: [{ staffSession: [] }]
      description: Account creation. No public registration exists.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201': { description: Created via invite or temporary-secret flow. No password returned. }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/deactivate:
    post:
      tags: [admin]
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200': { description: Deactivated, all sessions revoked }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/audit-logs:
    get:
      tags: [admin]
      security: [{ staffSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Paginated, redacted, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/smart-smile/consent:
    post:
      tags: [public]
      description: Creates a consent session. The raw token is returned once; only its SHA-256 hash is stored. Token TTL is not yet configured and this endpoint remains disabled unless both release gates are enabled.
      responses:
        '201':
          description: Consent session created
          content:
            application/json:
              schema:
                type: object
                required: [status, consent_token, consent_version, non_diagnostic]
                properties:
                  status: { const: consented }
                  consent_token: { type: string, description: Raw token returned only at creation. }
                  consent_version: { type: string }
                  non_diagnostic: { const: true }
        '503': { description: Smart Smile disabled by release gate }
  /api/v1/smart-smile/upload:
    post:
      tags: [public]
      description: Uploads one private input image under an existing, non-revoked consent token. Raw inputs follow the separate 90-day media policy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [consent_token, media]
              properties:
                consent_token: { type: string }
                media: { type: string, format: binary }
      responses:
        '202':
          description: Image accepted for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                required: [status, result, non_diagnostic, can_delete]
                properties:
                  status: { type: string, enum: [queued, processing, completed, failed, deleted] }
                  result: { type: [object, "null"], additionalProperties: true }
                  non_diagnostic: { const: true }
                  can_delete: { type: boolean }
        '403': { description: Missing or revoked consent }
        '422': { description: Invalid image or request }
        '503': { description: Smart Smile disabled by release gate }
  /api/v1/smart-smile/status:
    post:
      tags: [public]
      description: Returns the status and completed non-diagnostic result for the consent token holder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_token]
              properties:
                consent_token: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Current session state }
        '404': { description: Token not found }
        '503': { description: Smart Smile disabled by release gate }
  /api/v1/smart-smile:
    delete:
      tags: [public]
      description: Revokes the session, clears its result and soft-deletes its private input media. Consent evidence remains in the session record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_token]
              properties:
                consent_token: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Session revoked and result cleared }
        '404': { description: Token not found }
        '503': { description: Smart Smile disabled by release gate }
